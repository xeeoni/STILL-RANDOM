<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="영화 스틸컷을 랜덤으로 발견하는 사이트">
  <title>STILL / RANDOM — 영화 스틸컷 랜덤 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#">STILL<span>/</span>RANDOM</a>
    <button id="savedBtn" class="saved-btn">♡ 저장한 영화 <b id="savedCount">0</b></button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">FILM STILL DISCOVERY</p>
      <h1>오늘은 어떤<br><em>장면</em>을 발견할까?</h1>
      <p class="intro">장르, 색감, 시대, 분위기를 골라 영화의 한 장면을 랜덤으로 발견해보세요.</p>
    </section>

    <section class="filters" aria-label="영화 필터">
      <div class="filter-group">
        <label>MODE</label>
        <div class="chips" id="modeChips">
          <button class="chip active" data-mode="random">🎲 완전 랜덤</button>
          <button class="chip" data-mode="filter">🎯 조건 검색</button>
        </div>
      </div>

      <div id="filterPanel" class="filter-panel hidden">
        <div class="filter-group">
          <label>GENRE</label>
          <div class="chips" id="genreChips"></div>
        </div>
        <div class="filter-group">
          <label>COLOR</label>
          <div class="chips" id="colorChips"></div>
        </div>
        <div class="filter-group">
          <label>ERA</label>
          <div class="chips" id="eraChips"></div>
        </div>
        <div class="filter-group">
          <label>MOOD</label>
          <div class="chips" id="moodChips"></div>
        </div>
      </div>

      <button id="randomBtn" class="random-btn">🎲 STILL RANDOM</button>
    </section>

    <section class="result" aria-live="polite">
      <div class="still-wrap">
        <div id="imageFallback" class="image-fallback hidden">
          <span>STILL</span>
          <small>이미지 준비 중</small>
        </div>
        <img id="stillImage" src="" alt="영화 스틸컷">
        <button id="saveBtn" class="save-icon" aria-label="영화 저장">♡</button>
        <div class="counter"><span id="currentIndex">01</span> / <span id="totalCount">--</span></div>
      </div>

      <article class="movie-info">
        <div class="movie-tags" id="movieTags"></div>
        <h2 id="movieTitle">영화를 불러오는 중...</h2>
        <p class="meta" id="movieMeta"></p>
        <p class="description" id="movieDescription"></p>
        <div class="details">
          <div><span>DIRECTOR</span><strong id="movieDirector">—</strong></div>
          <div><span>GENRE</span><strong id="movieGenre">—</strong></div>
          <div><span>COLOR</span><strong id="movieColor">—</strong></div>
          <div><span>MOOD</span><strong id="movieMood">—</strong></div>
        </div>
      </article>
    </section>

    <section id="savedPanel" class="saved-panel hidden">
      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR COLLECTION</p>
          <h2>저장한 영화</h2>
        </div>
        <button id="closeSaved" class="text-btn">닫기 ×</button>
      </div>
      <div id="savedGrid" class="saved-grid"></div>
      <p id="emptySaved" class="empty">아직 저장한 영화가 없습니다.</p>
    </section>
  </main>

  <footer>
    <p>STILL / RANDOM · 영화 스틸컷을 발견하는 작은 실험</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
